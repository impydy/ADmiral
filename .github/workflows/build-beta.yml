name: Build beta installer

# Every push to the beta branch builds, tests and packages a beta installer
# (ADmiral-Setup-<version>-beta.<run>.exe) and keeps it as a workflow artifact.
# It never creates a tag or a GitHub Release; releases stay with build-exe.yml.
on:
  push:
    branches: [beta]
  workflow_dispatch:

permissions:
  contents: read

# a newer push to beta replaces a beta build still running
concurrency:
  group: beta-installer
  cancel-in-progress: true

env:
  DOTNET_CLI_TELEMETRY_OPTOUT: "1"
  DOTNET_NOLOGO: "1"
  DOTNET_SKIP_FIRST_TIME_EXPERIENCE: "1"

jobs:
  beta:
    runs-on: windows-latest
    timeout-minutes: 60
    env:
      HAS_SIGNING: ${{ secrets.SIGN_PFX_BASE64 != '' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - uses: actions/setup-dotnet@0f4a354dd5547a28c70b7853dbd95d5b67886e73  # v6.1.0
        with:
          dotnet-version: "10.0.x"
      - name: Version
        id: ver
        shell: pwsh
        run: |
          $version = ([xml](Get-Content Directory.Build.props)).Project.PropertyGroup.Version | Where-Object { $_ } | Select-Object -First 1
          if (-not $version) { throw "Version not found in Directory.Build.props" }
          $run = "${{ github.run_number }}"
          # shown / file name: 0.6.2-beta.7; Windows file version (numbers only): 0.6.2.7
          "version=$version" >> $env:GITHUB_OUTPUT
          "label=$version-beta.$run" >> $env:GITHUB_OUTPUT
          "numeric=$version.$run" >> $env:GITHUB_OUTPUT
          "ADmiral $version-beta.$run ($("${{ github.sha }}".Substring(0, 7)))"
      - name: Build
        shell: pwsh
        run: |
          dotnet build ADmiral.slnx -c Release
          if ($LASTEXITCODE -ne 0) { exit 1 }
      - name: Test
        shell: pwsh
        run: |
          dotnet test tests/ADmiral.Tests -c Release --no-build --logger "console;verbosity=normal"
          if ($LASTEXITCODE -ne 0) { exit 1 }
      - name: Publish (self-contained folder used by the installer)
        shell: pwsh
        run: |
          dotnet publish src/ADmiral.Desktop -c Release -r win-x64 --self-contained -o dist\ADmiral
          if ($LASTEXITCODE -ne 0) { exit 1 }
          foreach ($f in 'ADmiral.exe', 'WebView2Loader.dll', 'wwwroot\index.html', 'wwwroot\app.js') {
            if (-not (Test-Path "dist\ADmiral\$f")) { throw "$f missing from the publish folder" }
          }
      - name: Sign ADmiral.exe
        if: env.HAS_SIGNING == 'true'
        shell: pwsh
        env:
          SIGN_PFX_BASE64: ${{ secrets.SIGN_PFX_BASE64 }}
          SIGN_PFX_PASSWORD: ${{ secrets.SIGN_PFX_PASSWORD }}
        run: |
          function Sign-Files([string[]]$files) {
            $tool = Get-ChildItem "${env:ProgramFiles(x86)}\Windows Kits\10\bin\*\x64\signtool.exe" | Sort-Object FullName | Select-Object -Last 1
            $pfx = Join-Path $env:RUNNER_TEMP 'sign.pfx'
            [IO.File]::WriteAllBytes($pfx, [Convert]::FromBase64String($env:SIGN_PFX_BASE64))
            try {
              & $tool.FullName sign /fd SHA256 /td SHA256 /tr http://timestamp.digicert.com /f $pfx /p $env:SIGN_PFX_PASSWORD @files
              if ($LASTEXITCODE -ne 0) { throw "signtool failed" }
            } finally { Remove-Item $pfx -Force }
          }
          Sign-Files @("dist\ADmiral\ADmiral.exe", "dist\ADmiral\ADmiral.dll", "dist\ADmiral\ADmiral.Core.dll", "dist\ADmiral\ADmiral.Web.dll")
      - name: Self-test of the published folder
        shell: pwsh
        run: |
          $p = Start-Process dist\ADmiral\ADmiral.exe -ArgumentList '--self-test' -Wait -PassThru
          $log = Join-Path $env:APPDATA 'ADmiral\logs\admiral.log'
          Select-String -Path $log -Pattern "self-test" -ErrorAction SilentlyContinue | ForEach-Object { $_.Line }
          if ($p.ExitCode -ne 0) { throw "ADmiral.exe --self-test failed (exit $($p.ExitCode))" }
      - name: Build beta installer (Inno Setup)
        shell: pwsh
        run: |
          $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          if (-not (Test-Path $iscc)) { choco install innosetup -y --no-progress | Out-Null }
          Invoke-WebRequest "https://go.microsoft.com/fwlink/p/?LinkId=2124703" -OutFile packaging\MicrosoftEdgeWebview2Setup.exe
          & $iscc /Qp "/DAppVersion=${{ steps.ver.outputs.numeric }}" "/DVersionLabel=${{ steps.ver.outputs.label }}" `
            "/DSourceDir=$((Resolve-Path dist\ADmiral).Path)" packaging\installer.iss
          if ($LASTEXITCODE -ne 0) { exit 1 }
          $setup = "dist\ADmiral-Setup-${{ steps.ver.outputs.label }}.exe"
          if (-not (Test-Path $setup)) { throw "$setup was not built" }
          Get-Item $setup
      - name: Sign installer
        if: env.HAS_SIGNING == 'true'
        shell: pwsh
        env:
          SIGN_PFX_BASE64: ${{ secrets.SIGN_PFX_BASE64 }}
          SIGN_PFX_PASSWORD: ${{ secrets.SIGN_PFX_PASSWORD }}
        run: |
          $tool = Get-ChildItem "${env:ProgramFiles(x86)}\Windows Kits\10\bin\*\x64\signtool.exe" | Sort-Object FullName | Select-Object -Last 1
          $pfx = Join-Path $env:RUNNER_TEMP 'sign.pfx'
          [IO.File]::WriteAllBytes($pfx, [Convert]::FromBase64String($env:SIGN_PFX_BASE64))
          try {
            & $tool.FullName sign /fd SHA256 /td SHA256 /tr http://timestamp.digicert.com /f $pfx /p $env:SIGN_PFX_PASSWORD (Get-ChildItem dist\ADmiral-Setup-*.exe).FullName
            if ($LASTEXITCODE -ne 0) { throw "signtool failed" }
          } finally { Remove-Item $pfx -Force }
      - name: Test installer (silent install, self-test, UI test, uninstall)
        shell: pwsh
        run: |
          function Invoke-Admiral([string]$exe, [string]$arg, [string]$log) {
            $psi = New-Object System.Diagnostics.ProcessStartInfo $exe, $arg
            $psi.UseShellExecute = $false
            $psi.WorkingDirectory = Split-Path $exe
            $p = [System.Diagnostics.Process]::Start($psi)
            if (-not $p.WaitForExit(180000)) { $p.Kill($true); Get-Content $log -ErrorAction SilentlyContinue; throw "ADmiral $arg timed out" }
            Select-String -Path $log -Pattern "ui-test|self-test" -ErrorAction SilentlyContinue | ForEach-Object { $_.Line }
            if ($p.ExitCode -ne 0) { Get-Content $log -ErrorAction SilentlyContinue; throw "ADmiral $arg failed (exit $($p.ExitCode))" }
          }
          $setup = (Get-ChildItem dist\ADmiral-Setup-*.exe).FullName
          $app = "C:\ADmiral Beta\Program"
          $data = "C:\ADmiral Beta\Adatok"
          $p = Start-Process $setup -ArgumentList '/VERYSILENT','/SUPPRESSMSGBOXES','/NORESTART',"/DIR=""$app""","/DATADIR=""$data""",'/LOG=setup.log' -Wait -PassThru
          if ($p.ExitCode -ne 0) { Get-Content setup.log; exit 1 }
          if (-not (Test-Path "$app\ADmiral.exe")) { throw "ADmiral.exe not installed to $app" }
          $shown = (Get-ItemProperty 'HKLM:\SOFTWARE\Microsoft\Windows\CurrentVersion\Uninstall\*' | Where-Object { $_.DisplayName -eq 'ADmiral' }).DisplayVersion
          if ($shown -ne '${{ steps.ver.outputs.label }}') { throw "installed version shows '$shown', expected '${{ steps.ver.outputs.label }}'" }
          Invoke-Admiral "$app\ADmiral.exe" '--self-test' "$data\logs\admiral.log"
          Invoke-Admiral "$app\ADmiral.exe" '--ui-test' "$data\logs\admiral.log"
          Start-Process "$app\unins000.exe" -ArgumentList '/VERYSILENT','/SUPPRESSMSGBOXES','/NORESTART' -Wait | Out-Null
          for ($i = 0; $i -lt 60 -and (Test-Path "$app\ADmiral.exe"); $i++) { Start-Sleep -Seconds 1 }
          if (Test-Path "$app\ADmiral.exe") { throw "uninstall left ADmiral.exe behind" }
          "beta installer OK"
      - name: Checksum and summary
        shell: pwsh
        run: |
          $f = Get-Item "dist\ADmiral-Setup-${{ steps.ver.outputs.label }}.exe"
          $sha = (Get-FileHash $f.FullName -Algorithm SHA256).Hash.ToLowerInvariant()
          "$sha  $($f.Name)" | Set-Content -Encoding ascii "dist\SHA256SUMS.txt"
          @(
            "### ADmiral beta installer"
            ""
            "| | |"
            "|---|---|"
            "| File | ``$($f.Name)`` |"
            "| Version | ${{ steps.ver.outputs.label }} |"
            "| Commit | ``${{ github.sha }}`` |"
            "| Size | $([math]::Round($f.Length / 1MB, 1)) MB |"
            "| SHA-256 | ``$sha`` |"
            "| Signed | ${{ env.HAS_SIGNING }} |"
            ""
            "Download it from the **Artifacts** section of this run. This is a beta build: no tag, no release."
          ) -join "`n" >> $env:GITHUB_STEP_SUMMARY
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9  # v7.0.2
        with:
          name: ADmiral-beta-setup-${{ steps.ver.outputs.label }}
          path: |
            dist/ADmiral-Setup-*.exe
            dist/SHA256SUMS.txt
          if-no-files-found: error
          retention-days: 30
